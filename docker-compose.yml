services:
  postgres:
    image: postgres:16-alpine
    container_name: altabrisa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-altabrisa_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - altabrisa_pgdata:/var/lib/postgresql/data
    networks:
      - altabrisa_network

  redis:
    image: redis:7-alpine
    container_name: altabrisa_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - altabrisa_network

networks:
  altabrisa_network:
    driver: bridge

volumes:
  altabrisa_pgdata:
    driver: local
