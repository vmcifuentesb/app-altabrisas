name: Despliegue Automatico a Produccion (Altabrisa)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Compilar Frontend y Desplegar por FTP
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Instalar dependencias del frontend
        run: |
          cd frontend
          npm ci

      - name: 4. Compilar Frontend (React + Vite + Tailwind)
        run: |
          cd frontend
          npm run build

      - name: 5. Subir aplicacion a produccion (/altabrisa.promptendweb.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '66.225.221.182' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: altabrisa.promptendweb.com/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-altabrisa.json
